[workspace]
resolver = "2"
members = [
    "crates/oxide-k",
    "crates/oxide-compress",
    "crates/oxide-gen",
    "crates/oxide-browser-sh",
    "crates/oxide-mirror",
    "crates/oxide-llm-orchestrator",
    "crates/oxide-mcp-server",
    "crates/oxide-graph",
    "crates/oxide-mesh",
    "crates/oxide-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Rust Oxide Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manjunani/rust-oxide"
description = "Rust Oxide - The Agent-Native OS"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
syn = { version = "2.0", features = ["full", "parsing"] }
openapiv3 = "2.0"
apollo-parser = "0.8"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
scraper = "0.20"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
axum = { version = "0.7", features = ["macros"] }
tokio-tungstenite = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true
