[package]
name = "oxide-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Token-compression primitives for Rust Oxide (field selection, metadata stripping, semantic chunking). Compiles to WASM."

[lib]
# `cdylib` is required for `wasm-pack` to produce a `.wasm` artifact, while
# `rlib` keeps the crate usable from other Rust crates in the workspace and
# from `cargo test` on native targets.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# `wasm-bindgen` only needs to be linked when actually compiling to a wasm
# target. Gating the dependency keeps native builds slim and avoids dragging
# wasm-only proc macros into `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
# Smallest wasm artifacts: optimize for size, strip debug info.
wasm-opt = ["-Oz", "--enable-bulk-memory"]
