[package]
name = "oxide-k"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Oxide Kernel - micro-kernel core for the Rust Oxide Agent-Native OS"

[lib]
name = "oxide_k"
path = "src/lib.rs"

[[bin]]
name = "oxide-k"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = []
# Enable `wasmtime`-backed execution of WASM module artefacts. Off by default
# because `wasmtime` pulls in a substantial native dep tree (the WASM runtime
# is ~5 MB of code on its own).
wasmtime-runtime = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "26"
default-features = false
features = ["cranelift", "runtime", "std"]
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.12"
wat = "1.220"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
