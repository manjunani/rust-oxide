[package]
name = "oxide-k"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Oxide Kernel - micro-kernel core for the Rust Oxide Agent-Native OS"

[lib]
name = "oxide_k"
path = "src/lib.rs"

[[bin]]
name = "oxide-k"
path = "src/main.rs"

[features]
default = []
wasmtime-runtime = ["dep:wasmtime"]
encrypted        = ["dep:aes-gcm", "dep:sha2", "dep:base64ct", "dep:rand"]
# bus-bridge lives in oxide-mesh (avoids circular dep: oxide-mesh already
# depends on oxide-k). See oxide-mesh::bus_bridge.

[dependencies]
tokio            = { workspace = true }
sqlx             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
anyhow           = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait      = { workspace = true }
uuid             = { workspace = true }
chrono           = { workspace = true }
aes-gcm          = { version = "0.10", optional = true }
sha2             = { version = "0.10", optional = true }
base64ct         = { version = "1.6",  features = ["alloc"], optional = true }
rand             = { version = "0.9",  optional = true }

[dependencies.wasmtime]
# Pinned past every known advisory (CVE-2026-35186 family + earlier);
# track `cargo audit` and bump as new advisories land.
version = "44"
default-features = false
features = ["cranelift", "runtime", "std"]
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3.12"
wat = "1.220"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
