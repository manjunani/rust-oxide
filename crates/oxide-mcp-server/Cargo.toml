[package]
name = "oxide-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) server for Rust Oxide. Exposes oxide-gen generated CLIs and oxide-browser-sh / oxide-k bus actions as callable tools over stdio JSON-RPC."

[lib]
name = "oxide_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "oxide-mcp-server"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

oxide-k = { path = "../oxide-k", version = "0.3.0" }
axum = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
sse = ["dep:axum", "dep:futures"]
websocket = ["dep:tokio-tungstenite", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "io-util", "net"] }
tempfile = "3.12"
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
