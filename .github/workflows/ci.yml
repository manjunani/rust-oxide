name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  wasm:
    name: oxide-compress (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: cargo build (wasm32-unknown-unknown)
        run: cargo build -p oxide-compress --target wasm32-unknown-unknown --release
      - name: wasm-pack build --target web
        run: wasm-pack build crates/oxide-compress --target web --release
      - name: Upload wasm artefact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-compress-wasm
          path: |
            crates/oxide-compress/pkg/
            target/wasm32-unknown-unknown/release/oxide_compress.wasm

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit advisories
        # `--ignore RUSTSEC-2023-0071`: rsa crate pulled in by sqlx-mysql
        # which we never enable (sqlx is sqlite-only, default-features off).
        # Phantom Cargo.lock entry — no compiled artefact. See audit.toml
        # for the full rationale.
        run: cargo audit --ignore RUSTSEC-2023-0071

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    # Cross-crate intra-doc links (`oxide_k::...` from `oxide-mirror`, etc.)
    # don't resolve when the local crate is built in isolation; allow the
    # warning instead of failing CI. Other rustdoc warnings (broken syntax,
    # missing private docs) still surface in logs.
    env:
      RUSTDOCFLAGS: -A rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
